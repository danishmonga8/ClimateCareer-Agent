[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "climatecareer-agent"
version = "0.1.0"
description = "Human-supervised AI agent for climate, environmental, and AI job applications."
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "httpx>=0.27,<1.0",
    "streamlit>=1.36,<2.0",
    "langgraph>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
